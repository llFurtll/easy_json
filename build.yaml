builders:
  easy_json_builder:
    import: "package:dart_easy_json/builder.dart"
    builder_factories: ["easyJsonBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/generated/{{}}.easy.dart"]
      "^test/models/{{}}.dart": ["test/models/{{}}.easy.dart"]
    auto_apply: dependents
    build_to: source

targets:
  $default:
    builders:
      dart_easy_json:easy_json_builder:
        options:
          build_extensions:
            "^lib/{{}}.dart": "lib/generated/{{}}.easy.dart"
            "^test/models/{{}}.dart": "test/models/{{}}.easy.dart"